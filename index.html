<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SIVA GAMING HUB</title>
<meta name="description" content="SIVA GAMING HUB - Play 3D Car Racing, Snake, Tic Tac Toe, Space Shooter and Memory Match in your browser.">
<style>
  :root{
    --bg:#05030d;
    --bg2:#0b0720;
    --panel:rgba(18,10,40,.72);
    --purple:#b026ff;
    --purple2:#7a1cff;
    --blue:#00c8ff;
    --blue2:#0055ff;
    --text:#eae6ff;
    --muted:#8d86b3;
    --danger:#ff2e7e;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--blue);text-decoration:none}
  button,input,select{font:inherit}
  img{max-width:100%}

  /* ---------- Background ---------- */
  #bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .bg-glow{
    position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;pointer-events:none;
    animation:float 14s ease-in-out infinite alternate;
  }
  .bg-glow.g1{width:420px;height:420px;background:var(--purple);top:-120px;left:-100px}
  .bg-glow.g2{width:380px;height:380px;background:var(--blue2);bottom:-120px;right:-80px;animation-delay:-5s}
  @keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,30px) scale(1.12)}}

  /* ---------- Loader ---------- */
  #loader{
    position:fixed;inset:0;z-index:9999;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    transition:opacity .6s ease, visibility .6s;
  }
  #loader.hide{opacity:0;visibility:hidden}
  .loader-cube{width:70px;height:70px;position:relative;transform-style:preserve-3d;animation:spin3d 1.6s linear infinite}
  .loader-cube div{
    position:absolute;inset:0;border:2px solid var(--blue);
    background:rgba(0,200,255,.08);box-shadow:0 0 18px var(--blue),inset 0 0 14px rgba(176,38,255,.4);
  }
  .loader-cube div:nth-child(1){transform:rotateY(0deg) translateZ(35px)}
  .loader-cube div:nth-child(2){transform:rotateY(90deg) translateZ(35px);border-color:var(--purple)}
  .loader-cube div:nth-child(3){transform:rotateY(180deg) translateZ(35px)}
  .loader-cube div:nth-child(4){transform:rotateY(-90deg) translateZ(35px);border-color:var(--purple)}
  @keyframes spin3d{from{transform:rotateX(-20deg) rotateY(0deg)}to{transform:rotateX(-20deg) rotateY(360deg)}}
  .loader-title{
    font-size:1.4rem;font-weight:800;letter-spacing:6px;
    background:linear-gradient(90deg,var(--blue),var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:pulseText 1.4s ease-in-out infinite;
  }
  @keyframes pulseText{50%{opacity:.55}}
  .loader-bar{width:220px;height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
  .loader-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));box-shadow:0 0 12px var(--purple);transition:width .2s}
